[package]
name = "smsclient"
version = "0.1.0"
description = "SMSClient — Windows 4G/LTE SMS Desktop Client"
authors = ["ASTeam"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "smsclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
