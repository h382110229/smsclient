[package]
name = "smsclient"
version = "0.2.0"
description = "SMSClient — Windows 4G/LTE SMS Desktop Client"
authors = ["ASTeam"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "smsclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows = { version = "0.61.3", features = ["Devices_Sms", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Networking_Connectivity", "deprecated", "Win32_System_WinRT"] }
tauri-plugin-notification = "2.0.0-rc.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
